<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Walkmap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="/css/style.css" />
</head>

<body>
  <div id="map"></div>
  <aside id="panel">
    <header id="panel-header">
      <div id="header-left">
        <div id="panel-icon">
          <i class="bi bi-person-walking"></i>
        </div>
        <div>
          <h1 id="panel-title">Walkmap</h1>
          <p id="panel-subtitle">出発点から徒歩で行ける範囲を可視化します</p>
        </div>
      </div>
      <div id="lang-toggle">
        <button id="btn-ja" class="active" data-lang="ja">JA</button>
        <button id="btn-en" data-lang="en">EN</button>
      </div>
    </header>
    <div id="hint-box">
      <i class="bi bi-geo-alt-fill"></i>
      <span id="hint-text">地図上をクリックして出発点を設定してください</span>
    </div>
    <div id="slider-section">
      <div id="slider-label-row">
        <span id="slider-label">徒歩時間</span>
        <span id="slider-badge">10 分</span>
      </div>
      <input type="range" id="slider" min="1" max="30" value="10" />
      <div id="slider-hints">
        <span id="lbl-slider-min">1 分</span>
        <span id="dist-hint">≈ 800 m</span>
        <span id="lbl-slider-max">30 分</span>
      </div>
    </div>
    <div id="btn-row">
      <button id="btn-run" disabled>
        <i class="bi bi-play-fill"></i>
        <span id="btn-run-text">表示</span>
      </button>
      <button id="btn-clear" title="クリア">
        <i class="bi bi-trash3"></i>
      </button>
    </div>
    <div id="legend">
      <p id="legend-title">出発点からの距離</p>
      <div id="gradient-bar"></div>
      <div id="gradient-labels">
        <span id="lbl-near">近い</span>
        <span id="lbl-far">遠い</span>
      </div>
    </div>
  </aside>
  <div id="status-bar">
    <span id="status-icon-wrap"></span>
    <span id="status-text"></span>
  </div>
  <div id="stats-bar" hidden>
    <div class="stat">
      <div class="stat-val blue" id="stat-min">-</div>
      <div class="stat-lbl" id="lbl-minutes">分</div>
    </div>
    <div class="stat">
      <div class="stat-val green" id="stat-m">-</div>
      <div class="stat-lbl" id="lbl-meters">最大距離 (m)</div>
    </div>
    <div class="stat">
      <div class="stat-val orange" id="stat-nodes">-</div>
      <div class="stat-lbl" id="lbl-nodes">到達ノード数</div>
    </div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="/js/analysis.js"></script>
  <script src="/js/app.js"></script>
</body>

</html>
